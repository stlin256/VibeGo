<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">VibeGo mark</title>
  <desc id="desc">A forward-moving V-shaped route with a signal dot.</desc>
  <defs>
    <linearGradient id="mark-bg" x1="12" y1="8" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE1E6"/>
      <stop offset="0.52" stop-color="#6B8CFF"/>
      <stop offset="1" stop-color="#9A6BFF"/>
    </linearGradient>
    <linearGradient id="route" x1="22" y1="22" x2="76" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E6FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0B1020" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="25" fill="#0B1020"/>
  <rect x="7" y="7" width="82" height="82" rx="22" fill="url(#mark-bg)" opacity="0.98"/>
  <path d="M25 25 48 70 71 25" fill="none" stroke="#0B1020" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M25 25 48 70 71 25" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 70c0-15 10-27 27-35" fill="none" stroke="#B8F36C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="76" cy="35" r="6.5" fill="#B8F36C" stroke="#0B1020" stroke-width="3"/>
</svg>
